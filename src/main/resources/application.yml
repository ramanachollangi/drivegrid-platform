server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: drivegrid-rental

  datasource:
    url: jdbc:mysql://localhost:3306/drivegrid_dev
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
       format_sql: true
       dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
